# Render Blueprint for Legal AI System
# Deploy both frontend and backend on a single service

services:
  - type: web
    name: legal-ai-system
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
    startCommand: |
      uvicorn app.main:app --host 0.0.0.0 --port 8000 &
      cd frontend && PORT=3000 npm run start
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20
    healthCheckPath: /health
