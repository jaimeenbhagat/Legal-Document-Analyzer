# Render Blueprint for Legal AI System
# Single Docker container serving both frontend and backend

services:
  - type: web
    name: legal-ai-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: PORT
        value: 10000
    healthCheckPath: /health
    autoDeploy: true
